name: CF Probe Select

on:
  schedule:
    # 每天 UTC 06:30 运行（北京时间 14:30），避开高峰时段减少排队
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # 同一工作流同时只能跑一个实例，避免并行探测互相覆盖 cf_domains.txt
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  discover-cf-domains:
    runs-on: [self-hosted, linux, x64, cf-probe]
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      # 让 Setup 步骤装到 ~/.local/bin 的 python 在后续步骤全局可用；同时兜底标准 PATH（runner service 已补，这里双保险）
      PATH: "/home/github-runner/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 必须拉取完整历史，否则浅克隆下 git log 无法追溯到 worker/ 文件的最后提交，
          # 会导致 WORKER_VERSION 计算为空、版本号回落到部署时刻而每次都变。
          fetch-depth: 0

      - name: Detect region (CN → mirrors first, overseas → direct first)
        id: region
        run: |
          set -e
          # 查询出口 IP 归属国，判断国内/海外；查不到按海外处理（直连优先）
          # 用 grep+sed 解析，不依赖 python3（此时 python 尚未就绪）
          CC=$(curl -sS --connect-timeout 5 --max-time 10 https://ipinfo.io/json 2>/dev/null \
               | grep -o '"country":[[:space:]]*"[A-Z]*"' | head -1 | sed 's/.*"\([A-Z]*\)"/\1/')
          if [ "$CC" = "CN" ]; then
            echo "[*] 出口 IP 归属: 中国大陆 ($CC) → 镜像优先"
            echo "CC=CN" >> "$GITHUB_OUTPUT"
            echo "PYPI_PRIMARY=https://registry.npmmirror.com/pypi/simple/" >> "$GITHUB_OUTPUT"
            echo "PYPI_FALLBACK=https://pypi.org/simple/" >> "$GITHUB_OUTPUT"
          else
            echo "[*] 出口 IP 归属: 海外 ($CC) → 直连优先"
            echo "CC=$CC" >> "$GITHUB_OUTPUT"
            echo "PYPI_PRIMARY=https://pypi.org/simple/" >> "$GITHUB_OUTPUT"
            echo "PYPI_FALLBACK=https://registry.npmmirror.com/pypi/simple/" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.11 (auto region-aware, no sudo)
        env:
          REGION_CC: ${{ steps.region.outputs.CC }}
        run: |
          set -e
          export PATH="$HOME/.local/bin:$PATH"

          # 1) 优先用系统已装的 python3，版本 >= 3.11 即直接采用，跳过下载
          if command -v python3 >/dev/null 2>&1; then
            SYS_VER=$(python3 -c 'import sys;print("%d.%d"%(sys.version_info[0],sys.version_info[1]))' 2>/dev/null || echo 0.0)
            if [ "$SYS_VER" = "3.11" ] || [ "$SYS_VER" \> "3.11" ] 2>/dev/null; then
              mkdir -p "$HOME/.local/bin"
              # 优先用真实二进制 python3.11（/usr/bin 下，非软链），杜绝软链指回自身导致循环
              PYBIN=""
              if command -v python3.11 >/dev/null 2>&1; then
                PYBIN=$(command -v python3.11)
              else
                PYBIN=$(readlink -f "$(command -v python3)")
              fi
              ln -sf "$PYBIN" "$HOME/.local/bin/python"
              ln -sf "$PYBIN" "$HOME/.local/bin/python3"
              echo "[ok] 使用系统 Python $SYS_VER"
              python --version
              exit 0
            fi
          fi

          # 2) 系统不满足则下载官方预编译包
          #    国内：镜像优先 → 直连兜底；海外：直连优先 → 镜像兜底
          PY="python-3.11.17-linux-22.04-x64.tar.gz"
          DIRECT="https://github.com/actions/python-versions/releases/download/3.11.17-36876195594/$PY"
          M1="https://ghfile.geekertao.top/$DIRECT"
          M2="https://cdn.gh-proxy.com/$DIRECT"

          if [ "$REGION_CC" = "CN" ]; then
            URLS=("$M1" "$M2" "$DIRECT")
            echo "[*] 国内策略: 镜像优先"
          else
            URLS=("$DIRECT" "$M1" "$M2")
            echo "[*] 海外策略: 直连优先"
          fi

          DOWNLOADED=0
          for URL in "${URLS[@]}"; do
            echo "[*] 尝试下载: $URL"
            if curl -fL --connect-timeout 10 --max-time 120 -o /tmp/py.tar.gz "$URL" 2>/dev/null; then
              echo "[ok] 下载成功: $URL"
              DOWNLOADED=1
              break
            else
              echo "[!] 失败，尝试下一个源"
            fi
          done

          if [ "$DOWNLOADED" -eq 0 ]; then
            echo "[x] 所有源均下载失败"
            exit 1
          fi

          # 装到用户目录，无需 sudo
          PYHOME="$HOME/.local/python311"
          mkdir -p "$PYHOME"
          tar -xzf /tmp/py.tar.gz -C "$PYHOME" --strip-components=1
          mkdir -p "$HOME/.local/bin"
          ln -sf "$PYHOME/bin/python3.11" "$HOME/.local/bin/python"
          ln -sf "$PYHOME/bin/python3.11" "$HOME/.local/bin/python3"
          ln -sf "$PYHOME/bin/pip3.11" "$HOME/.local/bin/pip"
          python --version

      - name: Install dependencies (region-aware PyPI fallback)
        env:
          PYPI_PRIMARY: ${{ steps.region.outputs.PYPI_PRIMARY }}
          PYPI_FALLBACK: ${{ steps.region.outputs.PYPI_FALLBACK }}
        run: |
          set -e
          python -m pip install --upgrade pip -i "$PYPI_PRIMARY" || \
            python -m pip install --upgrade pip -i "$PYPI_FALLBACK"
          pip install -r requirements.txt -i "$PYPI_PRIMARY" || \
            pip install -r requirements.txt -i "$PYPI_FALLBACK"

      - name: Debug existing cf_domains.txt
        run: |
          echo "[debug] cwd: $(pwd)"
          echo "[debug] file exists: $(test -f cf_domains.txt && echo YES || echo NO)"
          if [ -f cf_domains.txt ]; then
            echo "[debug] line count: $(wc -l < cf_domains.txt)"
            echo "[debug] content preview:"
            head -n 20 cf_domains.txt
          fi

      - name: Run probe
        # 探测时长由脚本内部 PROBE_TIME_LIMIT 控制（600s）
        run: python cf_probe_select.py

      - name: Update wrangler.toml vars (fork-friendly + worker version)
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          from datetime import datetime, timezone, timedelta

          repo = os.environ["GITHUB_REPOSITORY"]
          url = f"https://raw.githubusercontent.com/{repo}/main/cf_domains.txt"
          changed = False

          # 取 worker/worker.js 与 worker/page.js 的最新提交时间作为前端版本号
          def worker_version():
              files = ["worker/worker.js", "worker/page.js"]
              latest = None
              for f in files:
                  try:
                      ts = subprocess.check_output(
                          ["git", "log", "-1", "--format=%cI", "--", f],
                          text=True
                      ).strip()
                      if not ts:
                          continue
                      dt = datetime.fromisoformat(ts)
                      if latest is None or dt > latest:
                          latest = dt
                  except Exception:
                      continue
              if not latest:
                  return ""
              bj = latest.astimezone(timezone(timedelta(hours=8)))
              return bj.strftime("%y%m%d%H%M")

          ver = worker_version()
          # 若 git 历史取不到（极少见），保留 wrangler.toml 现有 WORKER_VERSION，
          # 避免写成空值导致 worker.js 回落到部署时刻（版本号每次都变）。
          if not ver:
              m = re.search(r'WORKER_VERSION\s*=\s*"([^"]*)"', s)
              if m:
                  ver = m.group(1)

          # 确保 [vars] 段存在
          def ensure_vars(text):
              if "[vars]" not in text:
                  return text.rstrip() + "\n\n[vars]\n"
              return text

          # 更新或追加某个 [vars] 键值
          def set_var(text, key, value):
              pattern = rf'{key}\s*=\s*"[^"]*"'
              replacement = f'{key} = "{value}"'
              if re.search(pattern, text):
                  return re.sub(pattern, replacement, text)
              return text + f'{key} = "{value}"\n'

          # 更新 wrangler.toml 的 [vars]（RAW_DOMAINS_URL + WORKER_VERSION）
          toml = "wrangler.toml"
          s = open(toml, encoding="utf-8").read()
          new_s = ensure_vars(s)
          new_s = set_var(new_s, "RAW_DOMAINS_URL", url)
          new_s = set_var(new_s, "WORKER_VERSION", ver)
          if new_s != s:
              open(toml, "w", encoding="utf-8").write(new_s)
              changed = True

          # 更新 worker.js 的默认值常量（保持与 vars 一致，env 优先时取不到也能用）
          w = "worker/worker.js"
          ws = open(w, encoding="utf-8").read()
          new_ws = re.sub(r'const DEFAULT_RAW_DOMAINS_URL\s*=\s*"[^"]*"',
                          f'const DEFAULT_RAW_DOMAINS_URL = "{url}"', ws)
          if new_ws != ws:
              open(w, "w", encoding="utf-8").write(new_ws)
              changed = True

          if changed:
              print("wrangler.toml updated: RAW_DOMAINS_URL ->", url, "WORKER_VERSION ->", ver)
          else:
              print("RAW_DOMAINS_URL and WORKER_VERSION already match, skip update")
          PY

      - name: Refresh cf_ranges.json fallback
        run: |
          python3 - <<'PY'
          import json, urllib.request

          # 拉取 Cloudflare 官方 IPv4 段，作为仓库兜底（cf_ranges.json 的唯一数据源）。
          # 仅拉取成功且内容有变化时才覆盖；失败或相同则保留现有文件，避免无意义提交。
          url = "https://www.cloudflare.com/ips-v4"
          try:
              # 必须带 UA：Cloudflare 会拒绝 urllib 默认的 Python-urllib UA（403）
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (compatible; cf-probe-select)"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  text = r.read().decode("utf-8")
          except Exception as e:
              print("[skip] 拉取 CF IP 段失败，保留现有 cf_ranges.json:", e)
              raise SystemExit(0)

          ranges = [ln.strip() for ln in text.splitlines() if ln.strip() and "/" in ln]
          if not ranges:
              print("[skip] 拉取结果为空，保留现有 cf_ranges.json")
              raise SystemExit(0)

          with open("cf_ranges.json", encoding="utf-8") as f:
              cur = json.load(f)
          if ranges == cur:
              print("[skip] cf_ranges.json 已是最新，无需更新")
              raise SystemExit(0)

          with open("cf_ranges.json", "w", encoding="utf-8") as f:
              json.dump(ranges, f, indent=2, ensure_ascii=False)
          print(f"[ok] cf_ranges.json 已更新为 {len(ranges)} 条")
          PY

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cf_domains.txt wrangler.toml worker/worker.js cf_ranges.json
          if [ -z "$(git status --porcelain)" ]; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 自动探测更新 $(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S)"
            # 先拉取远程变更再推送，避免非快进冲突
            git pull --rebase --autostash
            git push
          fi
