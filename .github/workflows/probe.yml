name: CF Probe Select

on:
  schedule:
    # 每天 UTC 06:30 运行（北京时间 14:30），避开高峰时段减少排队
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # 同一工作流同时只能跑一个实例，避免并行探测互相覆盖 cf_domains.txt
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  discover-cf-domains:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 必须拉取完整历史，否则浅克隆下 git log 无法追溯到 worker/ 文件的最后提交，
          # 会导致 WORKER_VERSION 计算为空、版本号回落到部署时刻而每次都变。
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug existing cf_domains.txt
        run: |
          echo "[debug] cwd: $(pwd)"
          echo "[debug] file exists: $(test -f cf_domains.txt && echo YES || echo NO)"
          if [ -f cf_domains.txt ]; then
            echo "[debug] line count: $(wc -l < cf_domains.txt)"
            echo "[debug] content preview:"
            head -n 20 cf_domains.txt
          fi

      - name: Run probe
        # 探测时长由脚本内部 PROBE_TIME_LIMIT 控制（600s）
        run: python cf_probe_select.py

      - name: Update wrangler.toml vars (fork-friendly + worker version)
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          from datetime import datetime, timezone, timedelta

          repo = os.environ["GITHUB_REPOSITORY"]
          url = f"https://raw.githubusercontent.com/{repo}/main/cf_domains.txt"
          changed = False

          # 取 worker/worker.js 与 worker/page.js 的最新提交时间作为前端版本号
          def worker_version():
              files = ["worker/worker.js", "worker/page.js"]
              latest = None
              for f in files:
                  try:
                      ts = subprocess.check_output(
                          ["git", "log", "-1", "--format=%cI", "--", f],
                          text=True
                      ).strip()
                      if not ts:
                          continue
                      dt = datetime.fromisoformat(ts)
                      if latest is None or dt > latest:
                          latest = dt
                  except Exception:
                      continue
              if not latest:
                  return ""
              bj = latest.astimezone(timezone(timedelta(hours=8)))
              return bj.strftime("%y%m%d%H%M")

          ver = worker_version()
          # 若 git 历史取不到（极少见），保留 wrangler.toml 现有 WORKER_VERSION，
          # 避免写成空值导致 worker.js 回落到部署时刻（版本号每次都变）。
          if not ver:
              m = re.search(r'WORKER_VERSION\s*=\s*"([^"]*)"', s)
              if m:
                  ver = m.group(1)

          # 确保 [vars] 段存在
          def ensure_vars(text):
              if "[vars]" not in text:
                  return text.rstrip() + "\n\n[vars]\n"
              return text

          # 更新或追加某个 [vars] 键值
          def set_var(text, key, value):
              pattern = rf'{key}\s*=\s*"[^"]*"'
              replacement = f'{key} = "{value}"'
              if re.search(pattern, text):
                  return re.sub(pattern, replacement, text)
              return text + f'{key} = "{value}"\n'

          # 更新 wrangler.toml 的 [vars]（RAW_DOMAINS_URL + WORKER_VERSION）
          toml = "wrangler.toml"
          s = open(toml, encoding="utf-8").read()
          new_s = ensure_vars(s)
          new_s = set_var(new_s, "RAW_DOMAINS_URL", url)
          new_s = set_var(new_s, "WORKER_VERSION", ver)
          if new_s != s:
              open(toml, "w", encoding="utf-8").write(new_s)
              changed = True

          # 更新 worker.js 的默认值常量（保持与 vars 一致，env 优先时取不到也能用）
          w = "worker/worker.js"
          ws = open(w, encoding="utf-8").read()
          new_ws = re.sub(r'const DEFAULT_RAW_DOMAINS_URL\s*=\s*"[^"]*"',
                          f'const DEFAULT_RAW_DOMAINS_URL = "{url}"', ws)
          if new_ws != ws:
              open(w, "w", encoding="utf-8").write(new_ws)
              changed = True

          if changed:
              print("wrangler.toml updated: RAW_DOMAINS_URL ->", url, "WORKER_VERSION ->", ver)
          else:
              print("RAW_DOMAINS_URL and WORKER_VERSION already match, skip update")
          PY

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cf_domains.txt wrangler.toml worker/worker.js
          if [ -z "$(git status --porcelain)" ]; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 自动探测更新 $(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S)"
            # 先拉取远程变更再推送，避免非快进冲突
            git pull --rebase --autostash
            git push
          fi
