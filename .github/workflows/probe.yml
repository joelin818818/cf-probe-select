name: CF Probe Select

on:
  schedule:
    # 每天 UTC 00:00 运行（北京时间 08:00）
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # 同一工作流同时只能跑一个实例，避免并行探测互相覆盖 cf_domains.txt
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  discover-cf-domains:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 tldextract

      - name: Debug existing cf_domains.txt
        run: |
          echo "[debug] cwd: $(pwd)"
          echo "[debug] file exists: $(test -f cf_domains.txt && echo YES || echo NO)"
          if [ -f cf_domains.txt ]; then
            echo "[debug] line count: $(wc -l < cf_domains.txt)"
            echo "[debug] content preview:"
            head -n 20 cf_domains.txt
          fi

      - name: Run probe
        # 探测时长由脚本内部 PROBE_TIME_LIMIT 控制（600s）
        run: python cf_probe_select.py

      - name: Point RAW_DOMAINS_URL to current repo (fork-friendly)
        run: |
          python3 - <<'PY'
          import os, re
          repo = os.environ["GITHUB_REPOSITORY"]
          url = f"https://raw.githubusercontent.com/{repo}/main/cf_domains.txt"
          # 更新 wrangler.toml 的 [vars] RAW_DOMAINS_URL（不存在则追加段）
          toml = "wrangler.toml"
          s = open(toml, encoding="utf-8").read()
          if "RAW_DOMAINS_URL" in s:
              s = re.sub(r'RAW_DOMAINS_URL\s*=\s*"[^"]*"',
                         f'RAW_DOMAINS_URL = "{url}"', s)
          else:
              if "[vars]" not in s:
                  s = s.rstrip() + "\n\n[vars]\n"
              s += f'RAW_DOMAINS_URL = "{url}"\n'
              open(toml, "w", encoding="utf-8").write(s)
          # 更新 worker.js 的默认值常量（保持与 vars 一致，env 优先时取不到也能用）
          w = "worker/worker.js"
          ws = open(w, encoding="utf-8").read()
          ws = re.sub(r'const DEFAULT_RAW_DOMAINS_URL\s*=\s*"[^"]*"',
                      f'const DEFAULT_RAW_DOMAINS_URL = "{url}"', ws)
          open(w, "w", encoding="utf-8").write(ws)
          print("RAW_DOMAINS_URL ->", url)
          PY

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cf_domains.txt wrangler.toml worker/worker.js
          if [ -z "$(git status --porcelain cf_domains.txt)" ]; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 自动探测更新 $(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S)"
            # 先拉取远程变更再推送，避免非快进冲突
            git pull --rebase --autostash
            git push
          fi
