name: CF Probe Select

on:
  schedule:
    # 每天 UTC 00:00 运行（北京时间 08:00）
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # 同一工作流同时只能跑一个实例，避免并行探测互相覆盖 cf_domains.txt
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  discover-cf-domains:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 tldextract

      - name: Debug existing cf_domains.txt
        run: |
          echo "[debug] cwd: $(pwd)"
          echo "[debug] file exists: $(test -f cf_domains.txt && echo YES || echo NO)"
          if [ -f cf_domains.txt ]; then
            echo "[debug] line count: $(wc -l < cf_domains.txt)"
            echo "[debug] content preview:"
            head -n 20 cf_domains.txt
          fi

      - name: Run probe
        # 探测时长由脚本内部 PROBE_TIME_LIMIT 控制（600s）
        run: python cf_probe_select.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cf_domains.txt
          if [ -z "$(git status --porcelain cf_domains.txt)" ]; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 自动探测更新 $(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S)"
            # 先拉取远程变更再推送，避免非快进冲突
            git pull --rebase --autostash
            git push
          fi
