name: Ensure Worker Secret

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  ensure-sign-secret:
    runs-on: ubuntu-latest
    steps:
      # 仅在 SIGN_SECRET 不存在时生成一次；已存在则跳过，避免每次部署都改动密钥
      - name: Ensure SIGN_SECRET exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: cf-probe-select
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "[skip] 未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，跳过"
            exit 0
          fi
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/secrets"
          LIST=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" || true)
          if echo "$LIST" | grep -q 'SIGN_SECRET'; then
            echo "[skip] SIGN_SECRET 已存在，保持不变"
            exit 0
          fi
          SECRET=$(openssl rand -base64 48 | tr -d '\n')
          RESP=$(jq -n --arg s "$SECRET" '{name:"SIGN_SECRET", text:$s, type:"secret_text"}' | \
            curl -sS -X PUT --data-binary @- \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" "$API")
          if echo "$RESP" | grep -q '"success":true'; then
            echo "[ok] 已生成并写入 SIGN_SECRET（48 字节随机）"
          else
            echo "[fail] $RESP"
            exit 1
          fi
