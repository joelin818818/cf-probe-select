name: CF Probe Speed

on:
  schedule:
    # 每 12 小时测速一次（UTC 00:30 / 12:30，约北京时间 08:30 / 20:30）
    - cron: "30 0 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  speed-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run speed test
        run: python probe_speed.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: speed-results
          if-no-files-found: warn
          path: |
            ips.txt
            best_domains.txt

  summary:
    needs: speed-test
    runs-on: ubuntu-latest
    steps:
      - name: Download results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: speed-results
          path: .

      - name: Write job summary
        run: |
          {
            echo "## 优选测速结果"
            echo
            for f in ips.txt best_domains.txt; do
              echo "### $f"
              if [ -f "$f" ]; then
                echo '```'
                cat "$f"
                echo '```'
              else
                echo "本次未产出"
              fi
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

  commit:
    needs: speed-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: speed-results
          path: .

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in ips.txt best_domains.txt; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if [ -z "$(git status --porcelain)" ]; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: auto update speed results $(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S)"
            # 先拉取远程变更再推送，避免非快进冲突
            git pull --rebase --autostash
            git push
          fi
