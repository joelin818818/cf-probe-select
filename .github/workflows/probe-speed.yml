name: CF Probe Speed

on:
  schedule:
    # 每 12 小时测速一次（UTC 00:30 / 12:30，约北京时间 08:30 / 20:30）
    - cron: "30 0 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  speed-test:
    runs-on: [self-hosted, linux, x64, cf-probe]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect region (CN → mirrors first, overseas → direct first)
        id: region
        run: |
          set -e
          # 查询出口 IP 归属国，判断国内/海外；查不到按海外处理（直连优先）
          CC=$(curl -sS --connect-timeout 5 --max-time 10 https://ipinfo.io/json 2>/dev/null \
               | python3 -c 'import sys,json;print(json.load(sys.stdin).get("country",""))' 2>/dev/null || echo "")
          CC=$(echo "$CC" | tr '[:lower:]' '[:upper:]' | tr -cd 'A-Z')
          if [ "$CC" = "CN" ]; then
            echo "[*] 出口 IP 归属: 中国大陆 ($CC) → 镜像优先"
            echo "CC=CN" >> "$GITHUB_OUTPUT"
            echo "PYPI_PRIMARY=https://registry.npmmirror.com/pypi/simple/" >> "$GITHUB_OUTPUT"
            echo "PYPI_FALLBACK=https://pypi.org/simple/" >> "$GITHUB_OUTPUT"
          else
            echo "[*] 出口 IP 归属: 海外 ($CC) → 直连优先"
            echo "CC=$CC" >> "$GITHUB_OUTPUT"
            echo "PYPI_PRIMARY=https://pypi.org/simple/" >> "$GITHUB_OUTPUT"
            echo "PYPI_FALLBACK=https://registry.npmmirror.com/pypi/simple/" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.11 (auto region-aware)
        env:
          REGION_CC: ${{ steps.region.outputs.CC }}
        run: |
          set -e
          # 1) 优先用系统已装的 python3，版本 >= 3.11 即直接采用，跳过下载
          if command -v python3 >/dev/null 2>&1; then
            SYS_VER=$(python3 -c 'import sys;print("%d.%d"%(sys.version_info[0],sys.version_info[1]))' 2>/dev/null || echo 0.0)
            if [ "$SYS_VER" = "3.11" ] || [ "$SYS_VER" \> "3.11" ] 2>/dev/null; then
              sudo ln -sf "$(command -v python3)" /usr/local/bin/python
              sudo ln -sf "$(command -v python3)" /usr/local/bin/python3
              echo "[ok] 使用系统 Python $SYS_VER"
              python --version
              exit 0
            fi
          fi

          # 2) 系统不满足则下载官方预编译包
          #    国内：镜像优先 → 直连兜底；海外：直连优先 → 镜像兜底
          PY="python-3.11.17-linux-22.04-x64.tar.gz"
          DIRECT="https://github.com/actions/python-versions/releases/download/3.11.17-36876195594/$PY"
          M1="https://ghfile.geekertao.top/$DIRECT"
          M2="https://cdn.gh-proxy.com/$DIRECT"

          if [ "$REGION_CC" = "CN" ]; then
            URLS=("$M1" "$M2" "$DIRECT")
            echo "[*] 国内策略: 镜像优先"
          else
            URLS=("$DIRECT" "$M1" "$M2")
            echo "[*] 海外策略: 直连优先"
          fi

          DOWNLOADED=0
          for URL in "${URLS[@]}"; do
            echo "[*] 尝试下载: $URL"
            if curl -fL --connect-timeout 10 --max-time 120 -o /tmp/py.tar.gz "$URL" 2>/dev/null; then
              echo "[ok] 下载成功: $URL"
              DOWNLOADED=1
              break
            else
              echo "[!] 失败，尝试下一个源"
            fi
          done

          if [ "$DOWNLOADED" -eq 0 ]; then
            echo "[x] 所有源均下载失败"
            exit 1
          fi

          sudo mkdir -p /opt/python311
          sudo tar -xzf /tmp/py.tar.gz -C /opt/python311 --strip-components=1
          sudo ln -sf /opt/python311/bin/python3.11 /usr/local/bin/python
          sudo ln -sf /opt/python311/bin/python3.11 /usr/local/bin/python3
          sudo ln -sf /opt/python311/bin/pip3.11 /usr/local/bin/pip
          /usr/local/bin/python --version

      - name: Install dependencies (region-aware PyPI fallback)
        env:
          PYPI_PRIMARY: ${{ steps.region.outputs.PYPI_PRIMARY }}
          PYPI_FALLBACK: ${{ steps.region.outputs.PYPI_FALLBACK }}
        run: |
          set -e
          python -m pip install --upgrade pip -i "$PYPI_PRIMARY" || \
            python -m pip install --upgrade pip -i "$PYPI_FALLBACK"
          pip install -r requirements.txt -i "$PYPI_PRIMARY" || \
            pip install -r requirements.txt -i "$PYPI_FALLBACK"

      - name: Run speed test
        run: python probe_speed.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: speed-results
          if-no-files-found: warn
          path: |
            ips.txt
            best_domains.txt

  summary:
    needs: speed-test
    runs-on: [self-hosted, linux, x64, cf-probe]
    steps:
      - name: Download results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: speed-results
          path: .

      - name: Write job summary
        run: |
          {
            echo "## 优选测速结果"
            echo
            for f in ips.txt best_domains.txt; do
              echo "### $f"
              if [ -f "$f" ]; then
                echo '```'
                cat "$f"
                echo '```'
              else
                echo "本次未产出"
              fi
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

  commit:
    needs: speed-test
    runs-on: [self-hosted, linux, x64, cf-probe]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: speed-results
          path: .

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in ips.txt best_domains.txt; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if [ -z "$(git status --porcelain)" ]; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: auto update speed results $(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S)"
            # 先拉取远程变更再推送，避免非快进冲突
            git pull --rebase --autostash
            git push
          fi
