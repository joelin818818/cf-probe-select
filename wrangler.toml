name = "cf-probe-select"
main = "worker/worker.js"
compatibility_date = "2024-09-23"

# 如需绑定自定义域名，取消下行注释并在 Cloudflare 面板添加
# routes = [
#   { pattern = "speed.your-domain.com", custom_domain = true }
# ]

# 无需 KV / D1，域名列表运行时从 GitHub raw 拉取

# 域名列表来源（fork 后由 .github/workflows/probe.yml 自动改成你的仓库地址）。
# 删除此行即回落到 worker.js 内的默认地址（上游仓库）。
# WORKER_VERSION 由 Actions 自动写入，为 worker/ 目录最新提交时间（北京时间 YYMMDDHHmm）。
[vars]
RAW_DOMAINS_URL = "https://raw.githubusercontent.com/joelin818818/cf-probe-select/main/cf_domains.txt"
WORKER_VERSION = "2608311703"
